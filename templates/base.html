<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ADVENTURE{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for m in messages %}<p>{{ m }}</p>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Шапка -->
    <header class="site-header">
        <div class="header-inner">
            <a href="{{ url_for('index') }}" class="logo">ADVENTURE</a>

            <form class="search-form" action="{{ url_for('adventures') }}" method="get">
                <input type="text" class="search-input" placeholder="Поиск по сайту" aria-label="Поиск по сайту">
            </form>

            <nav class="nav">
                <a href="{{ url_for('adventures') }}" class="nav-link">ПРИКЛЮЧЕНИЯ</a>
            </nav>
        </div>
    </header>

    <!-- Основной контент -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Футер -->
    <footer class="site-footer">
        <div class="footer-inner">
            <span>© ADVENTURE</span>
            <span>2026</span>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/carousel.js') }}"></script>

</body>
</html>
